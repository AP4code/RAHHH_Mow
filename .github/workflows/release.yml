name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install root dependencies
        run: npm install

      - name: Install bot dependencies
        working-directory: bot
        run: npm install

      - name: Fetch bundled Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path node | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v18.9.1/node-v18.9.1-win-x64.zip" -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node_extract
          Copy-Item -Path "node_extract\node-v18.9.1-win-x64\node.exe" -Destination "node\node.exe"
          Remove-Item -Recurse -Force node_extract, node.zip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "rahhh ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
